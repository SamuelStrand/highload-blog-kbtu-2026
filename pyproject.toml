[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sis2-blog-platform"
version = "0.1.0"
description = "SIS-2 Blog Platform: REST/JSON over HTTP/1.1 and HTTP/2"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1",
  "pydantic>=2.9,<3",
  "hypercorn>=0.17,<1",
  "httpx[http2]>=0.28,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "PyJWT>=2.10,<3",
  "python-dotenv>=1,<2",
  "cryptography>=44",
  "matplotlib>=3.9,<4",
  "psutil>=6,<8",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[project.scripts]
blogctl = "blog_service.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires local PostgreSQL and may start a real TLS server"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
